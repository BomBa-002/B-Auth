# @file        : docker-compose.dev.yml
# @description : وضع التطوير — Backend (tsx watch) + Frontend (vite dev) + MinIO.
#                الكود مربوط بحجم مشترك (volume) فالتعديل الفوري يشتغل جوه الحاويات.
# التشغيل: pnpm docker:dev:up   |   الإيقاف: pnpm docker:dev:down

name: b-auth-dev

services:
  # ---------- تخزين الكائنات (S3-compatible) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # إنشاء الـ bucket الافتراضي مرة واحدة
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-b-auth-storage}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  # ---------- الـ API (تشغيل حي) ----------
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_SESSION: 1d
      JWT_REFRESH_TTL_REMEMBER: 30d
      COOKIE_SECURE: "false"
      DATA_DIR: /app/data
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-b-auth-storage}
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      # الكود حي — tsx بيعمل restart تلقائي مع أي تعديل
      - ./Backend/src:/app/Backend/src
      # البيانات محلية عشان تفضل موجودة بين الجلسات وتقدر تتفرج عليها
      - ./Backend/data:/app/data
    ports:
      - "4000:4000"
    depends_on:
      minio:
        condition: service_healthy

  # ---------- الواجهة (تشغيل حي) ----------
  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      target: dev
    environment:
      # الـ vite proxy جوه الشبكة الداخلية بيوصل على الـ backend مباشرة
      VITE_API_PROXY_TARGET: http://backend:4000
    volumes:
      # الكود حي — HMR بتاع vite بيعمل تحديث فوري
      - ./Frontend/src:/app/Frontend/src
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  minio-data:
