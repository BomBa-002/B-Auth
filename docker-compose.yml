# @file        : docker-compose.yml
# @description : تشغيل المشروع كامل — Frontend (nginx) + Backend (node) + MinIO (S3-compatible).
# التشغيل: pnpm docker:up  أو  docker compose up --build

name: b-auth

services:
  # ---------- تخزين الكائنات (S3-compatible) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # إنشاء الـ bucket الافتراضي مرة واحدة
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-b-auth-storage}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  # ---------- الـ API ----------
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_SESSION: 1d
      JWT_REFRESH_TTL_REMEMBER: 30d
      COOKIE_SECURE: "false"
      DATA_DIR: /app/data
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-b-auth-storage}
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - backend-data:/app/data
    ports:
      - "4000:4000"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      # /ready بيفحص الـ storage كمان — أقوى من /live
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- الواجهة ----------
  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  minio-data:
  backend-data:
