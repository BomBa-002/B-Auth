<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('b-auth:settings') || '{}').state || {}
          const theme = saved.theme === 'light' || saved.theme === 'dark' ? saved.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          const language = saved.language === 'ar' ? 'ar' : 'en'
          document.documentElement.dataset.theme = theme
          document.documentElement.lang = language
          document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'
          document.documentElement.style.colorScheme = theme
        } catch (_) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo-favicon.svg" />
    <!-- خط Noto Sans Arabic محمّل صراحةً لضمان عرض النصوص العربية على أي نظام -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>B-Auth — Identity &amp; Access Console</title>
    <meta
      name="description"
      content="B-Auth is a modular authentication and access-management console with role-based permissions, session control, and multi-language support."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
